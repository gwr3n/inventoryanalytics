[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventoryanalytics"
version = "2.2"
description = "A Python library dedicated to Inventory Analytics."
readme = "README.md"
requires-python = ">=3.8,<3.14"
license = "MIT"
authors = [
    { name = "Roberto Rossi", email = "robros@gmail.com" },
]
keywords = ["inventory", "analytics"]
dependencies = [
    "numpy==1.23.5; python_version < '3.11'",
    "numpy>=2.1,<3; python_version >= '3.11'",
    "scipy==1.10.1; python_version < '3.11'",
    "scipy>=1.14.1,<2; python_version >= '3.11'",
    "matplotlib==3.7.5; python_version < '3.11'",
    "matplotlib>=3.9.2,<4; python_version >= '3.11'",
    "scikit-learn==1.5.0; python_version < '3.11'",
    "scikit-learn>=1.6,<2; python_version >= '3.11'",
    "statsmodels==0.14.1; python_version < '3.11'",
    "statsmodels>=0.14.4,<1; python_version >= '3.11'",
    "docplex==2.25.236; python_version < '3.11'",
    "docplex>=2.32.264,<3; python_version >= '3.11'",
    "cplex>=22.1.2.1,<23; python_version >= '3.11'",
    "networkx==2.8.8",
]

[project.scripts]
inventoryanalytics = "inventoryanalytics.cli:main"

[project.urls]
Homepage = "https://github.com/gwr3n/inventoryanalytics"
Repository = "https://github.com/gwr3n/inventoryanalytics"

[tool.setuptools.packages.find]
include = ["inventoryanalytics*"]

[tool.setuptools.package-data]
"inventoryanalytics.abc" = ["data/*.csv"]

[tool.coverage.run]
source = ["inventoryanalytics"]
omit = [
    "__init__.py",
    "__main__.py",
    "*/__init__.py",
    "*/__main__.py",
    "inventoryanalytics/**/test/*.py",
    "inventoryanalytics/**/*_test.py",
    "inventoryanalytics/abc/*.py",
]

[tool.coverage.report]
omit = [
    "__init__.py",
    "__main__.py",
    "*/__init__.py",
    "*/__main__.py",
    "inventoryanalytics/**/test/*.py",
    "inventoryanalytics/**/*_test.py",
    "inventoryanalytics/abc/*.py",
]